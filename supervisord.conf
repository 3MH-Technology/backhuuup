[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:dockerd]
command=/usr/bin/dockerd --tls=false --host=unix:///var/run/docker.sock --storage-driver=overlay2 --log-level=warn --iptables=true --ip-forward=true --bridge=none
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/app/logs/dockerd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/dockerd.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

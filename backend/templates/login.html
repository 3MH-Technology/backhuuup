<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Host — استضافة الذب هوست | تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Tajawal"', 'system-ui', 'sans-serif'] },
          animation: { 'glow': 'glow 2s ease-in-out infinite alternate' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0a0f1e 100%); }
    .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .input-field { transition: all 0.3s ease; }
    .input-field:focus { box-shadow: 0 0 0 3px rgba(59,130,246,0.2); border-color: #3b82f6; }
    .wolf-glow { text-shadow: 0 0 40px rgba(59,130,246,0.3); }
    @keyframes glow { from { opacity: 0.6; } to { opacity: 1; } }
  </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/static/logo.jpg" class="w-24 h-24 mx-auto rounded-3xl shadow-2xl shadow-blue-500/20 mb-5 object-cover border-2 border-gray-700/50">
      <h1 class="text-4xl font-black text-white wolf-glow">Wolf Host</h1>
      <p class="text-lg text-gray-400 mt-1 font-medium">استضافة الذب هوست</p>
      <p class="text-gray-600 text-sm mt-2">منصة استضافة البوتات المجانية للمطورين العرب</p>
    </div>

    <div class="glass-card rounded-2xl p-8">
      <h2 class="text-xl font-bold text-white mb-6">تسجيل الدخول</h2>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">البريد الإلكتروني</label>
          <input type="email" id="email" required
            class="input-field w-full px-4 py-3 bg-gray-800/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-blue-500 focus:outline-none"
            placeholder="m@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">كلمة المرور</label>
          <input type="password" id="password" required
            class="input-field w-full px-4 py-3 bg-gray-800/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-blue-500 focus:outline-none"
            placeholder="••••••••">
        </div>
        <button type="submit"
          class="w-full py-3 bg-gradient-to-l from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold rounded-xl transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-blue-500/20">
          تسجيل الدخول
        </button>
      </form>
      <div id="errorMsg" class="mt-4 text-red-400 text-sm text-center hidden"></div>
      <p class="mt-6 text-center text-gray-400 text-sm">
        ليس لديك حساب؟
        <a href="/register" class="text-blue-400 hover:text-blue-300 font-medium">إنشاء حساب جديد</a>
      </p>
    </div>

    <div class="mt-8 text-center space-y-2">
      <p class="text-gray-500 text-xs">مبني بـ ❤️ بواسطة</p>
      <p class="text-gray-300 text-sm font-bold">الذئب الأبيض 🐺</p>
      <div class="flex items-center justify-center gap-4 text-xs text-gray-600">
        <a href="https://t.me/j49_c" target="_blank" class="hover:text-blue-400 transition">تيليجرام: @j49_c</a>
        <span>|</span>
        <a href="https://t.me/O5O6J" target="_blank" class="hover:text-blue-400 transition">القناة: @O5O6J</a>
        <span>|</span>
        <a href="https://x.com/wolfhost_1" target="_blank" class="hover:text-blue-400 transition">إكس: @wolfhost_1</a>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.classList.add('hidden');
      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard';
        } else {
          if (data.detail && data.detail.includes('غير موثق')) {
            errorEl.innerHTML = 'البريد الإلكتروني غير موثق. <a href="/verify?email=' + encodeURIComponent(email) + '" class="text-blue-400 underline">توثيق الآن</a>';
          } else {
            errorEl.textContent = data.detail || 'فشل تسجيل الدخول';
          }
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'خطأ في الاتصال بالخادم';
        errorEl.classList.remove('hidden');
      }
    });
  </script>

  <!-- Promo Footer -->
  <div class="fixed bottom-0 left-0 right-0 bg-black/60 backdrop-blur-md border-t border-gray-800/50 p-2 text-center">
    <div class="flex items-center justify-center gap-3 text-xs">
      <span class="text-gray-500">🐺 Wolf Host —</span>
      <a href="https://t.me/j49_c" target="_blank" class="text-blue-400 hover:text-blue-300 font-medium">@j49_c</a>
      <span class="text-gray-600">|</span>
      <a href="https://t.me/O5O6J" target="_blank" class="text-purple-400 hover:text-purple-300 font-medium">@O5O6J</a>
      <span class="text-gray-600">|</span>
      <a href="https://x.com/wolfhost_1" target="_blank" class="text-gray-400 hover:text-gray-300 font-medium">@wolfhost_1</a>
    </div>
  </div>
</body>
</html>

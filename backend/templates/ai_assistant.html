<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Host — المساعد الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', system-ui, sans-serif; }
    .bg-app { background: linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0a0f1e 100%); }
    .card { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
    .chat-container { height: calc(100vh - 200px); min-height: 400px; }
    .msg-user { background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 20px 20px 5px 20px; }
    .msg-ai { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px 20px 20px 5px; }
    .typing-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; animation: typing 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="bg-app text-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <a href="/dashboard" class="text-gray-400 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <img src="/static/logo.jpg" class="w-9 h-9 rounded-xl object-cover">
        <div>
          <h1 class="text-lg font-bold text-white">المساعد الذكي</h1>
          <p class="text-xs text-gray-500">مدعوم بـ llama3.2 — <span id="remainingDisplay">30</span> رسالة اليوم</p>
        </div>
      </div>
      <button onclick="clearChat()" class="text-sm text-gray-500 hover:text-red-400 transition">مسح المحادثة</button>
    </div>

    <!-- Chat -->
    <div class="card p-4 chat-container flex flex-col">
      <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 p-2">
        <div class="msg-ai p-4 text-sm text-gray-200 max-w-[85%]">
          👋 مرحباً! أنا مساعد Wolf Host الذكي. أساعدك في:<br>
          • استضافة البوتات على المنصة<br>
          • كتابة كود بايثون و PHP<br>
          • حل مشاكل البرمجة<br>
          • نصائح الترويج لحساباتك<br><br>
          <span class="text-gray-500">اسألني أي شيء 🤖</span>
        </div>
      </div>

      <!-- Input -->
      <div class="mt-4 flex gap-2">
        <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا..."
          class="flex-1 px-4 py-3 bg-gray-800/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-blue-500 focus:outline-none"
          onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="btn-primary px-6 py-3 rounded-xl text-white font-medium flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7"/></svg>
          إرسال
        </button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }; }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';

      const container = document.getElementById('chatMessages');
      container.innerHTML += `<div class="msg-user p-4 text-sm text-white max-w-[85%] mr-auto">${escapeHtml(msg)}</div>`;

      const typingId = 'typing-' + Date.now();
      container.innerHTML += `<div id="${typingId}" class="msg-ai p-4 max-w-[85%]"><span class="typing-dot bg-blue-400"></span><span class="typing-dot bg-blue-400"></span><span class="typing-dot bg-blue-400"></span></div>`;
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch(`${API}/api/ai/chat`, {
          method: 'POST', headers: getHeaders(),
          body: JSON.stringify({ message: msg }),
        });
        document.getElementById(typingId).remove();
        const data = await res.json();
        if (res.ok) {
          container.innerHTML += `<div class="msg-ai p-4 text-sm text-gray-200 max-w-[85%]">${escapeHtml(data.response)}</div>`;
          document.getElementById('remainingDisplay').textContent = data.remaining;
        } else {
          container.innerHTML += `<div class="msg-ai p-4 text-sm text-red-400 max-w-[85%]">${escapeHtml(data.detail || 'حدث خطأ')}</div>`;
        }
      } catch (e) {
        document.getElementById(typingId).remove();
        container.innerHTML += `<div class="msg-ai p-4 text-sm text-red-400 max-w-[85%]">خطأ في الاتصال</div>`;
      }
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML.replace(/\n/g, '<br>');
    }

    function clearChat() {
      document.getElementById('chatMessages').innerHTML = `
        <div class="msg-ai p-4 text-sm text-gray-200 max-w-[85%]">
          👋 تم مسح المحادثة. اسألني أي شيء!
        </div>
      `;
    }
  </script>
</body>
</html>

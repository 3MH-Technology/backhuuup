<!DOCTYPE html>

<head>

  <script>
(function(){function _p(){['contextmenu','keydown','keyup'].forEach(function(e){document.addEventListener(e,function(ev){if(ev.type==='contextmenu'){ev.preventDefault();ev.stopPropagation();return false}if(ev.type==='keydown'||ev.type==='keyup'){if(ev.key==='F12'||(ev.ctrlKey&&ev.shiftKey&&['I','J','C'].includes(ev.key.toUpperCase()))||(ev.ctrlKey&&ev.key==='u')){ev.preventDefault();ev.stopPropagation();return false}}},false)});var _d=new Date();debugger;var _t=new Date()-_d;if(_t>100){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0f1e;color:#ef4444;font-family:sans-serif;font-size:24px;font-weight:bold;text-align:center;padding:20px">🚫 أدوات المطور غير مسموح بها</div>'}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_p)}else{_p()}})();
</script>
  <style>
    * { font-family: 'Tajawal', system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0a0f1e 100%); }
    .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/static/logo.jpg" class="w-24 h-24 mx-auto rounded-3xl shadow-2xl shadow-emerald-500/20 mb-5 object-cover border-2 border-gray-700/50">
      <h1 class="text-4xl font-black text-white">Wolf Host</h1>
      <p class="text-lg text-gray-400 mt-1 font-medium">استضافة الذب هوست</p>
      <p class="text-gray-500 text-sm mt-2">انضم إلى مجتمع المطورين العرب</p>
    </div>

    <div class="glass-card rounded-2xl p-8">
      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">اسم المستخدم</label>
          <input type="text" id="username" required class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-emerald-500 focus:outline-none" placeholder="اسم المستخدم">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">كلمة المرور</label>
          <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 bg-gray-800/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-emerald-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-l from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-emerald-500/20">
          إنشاء الحساب
        </button>
      </form>
      <div id="errorMsg" class="mt-4 text-red-400 text-sm text-center hidden"></div>
      <p class="mt-6 text-center text-gray-400 text-sm">
        لديك حساب بالفعل؟
        <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-medium">تسجيل الدخول</a>
      </p>
    </div>

    <div class="mt-8 text-center space-y-2">
      <p class="text-gray-500 text-xs">مبني بـ ❤️ بواسطة</p>
      <p class="text-gray-300 text-sm font-bold">الذئب الأبيض 🐺</p>
      <div class="flex items-center justify-center gap-4 text-xs text-gray-600">
        <a href="https://t.me/j49_c" target="_blank" class="hover:text-emerald-400 transition">@j49_c</a>
        <span>|</span>
        <a href="https://t.me/O5O6J" target="_blank" class="hover:text-emerald-400 transition">@O5O6J</a>
        <span>|</span>
        <a href="https://t.me/Wolfhost_1" target="_blank" class="hover:text-emerald-400 transition">@Wolfhost_1</a>
        <span>|</span>
        <a href="https://x.com/wolfhost_1" target="_blank" class="hover:text-emerald-400 transition">@wolfhost_1</a>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    function getDeviceFingerprint() {
      let fp = localStorage.getItem('device_fp');
      if (!fp) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillText('Wolf', 2, 2);
        const raw = canvas.toDataURL() + navigator.userAgent + screen.width + screen.height + navigator.language;
        let h = 0;
        for (let i = 0; i < raw.length; i++) { h = ((h << 5) - h) + raw.charCodeAt(i); h |= 0; }
        fp = 'fp_' + Math.abs(h).toString(36);
        localStorage.setItem('device_fp', fp);
      }
      return fp;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMsg');
      errorEl.classList.add('hidden');
      try {
        const res = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            device_fingerprint: getDeviceFingerprint(),
          }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard';
        } else {
          errorEl.textContent = typeof data.detail === 'string' ? data.detail : 'فشل إنشاء الحساب';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'خطأ في الاتصال بالخادم';
        errorEl.classList.remove('hidden');
      }
    });
  </script>

  <div class="fixed bottom-0 left-0 right-0 bg-black/60 backdrop-blur-md border-t border-gray-800/50 p-2 text-center">
    <div class="flex items-center justify-center gap-3 text-xs">
      <span class="text-gray-500">🐺 Wolf Host —</span>
      <a href="https://t.me/j49_c" target="_blank" class="text-blue-400 hover:text-blue-300 font-medium">@j49_c</a>
      <span class="text-gray-600">|</span>
      <a href="https://t.me/O5O6J" target="_blank" class="text-purple-400 hover:text-purple-300 font-medium">@O5O6J</a>
      <span class="text-gray-600">|</span>
      <a href="https://t.me/Wolfhost_1" target="_blank" class="text-emerald-400 hover:text-emerald-300 font-medium">@Wolfhost_1</a>
      <span class="text-gray-600">|</span>
      <a href="https://x.com/wolfhost_1" target="_blank" class="text-gray-400 hover:text-gray-300 font-medium">@wolfhost_1</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Host — نسيت كلمة المرور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script>
(function(){function _p(){['contextmenu','keydown','keyup'].forEach(function(e){document.addEventListener(e,function(ev){if(ev.type==='contextmenu'){ev.preventDefault();ev.stopPropagation();return false}if(ev.type==='keydown'||ev.type==='keyup'){if(ev.key==='F12'||(ev.ctrlKey&&ev.shiftKey&&['I','J','C'].includes(ev.key.toUpperCase()))||(ev.ctrlKey&&ev.key==='u')){ev.preventDefault();ev.stopPropagation();return false}}},false)});var _d=new Date();debugger;var _t=new Date()-_d;if(_t>100){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0f1e;color:#ef4444;font-family:sans-serif;font-size:24px;font-weight:bold;text-align:center;padding:20px">🚫 أدوات المطور غير مسموح بها</div>'}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_p)}else{_p()}})();
</script>
  <style>
    * { font-family: 'Tajawal', system-ui, sans-serif; }
    .bg-app { background: linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0a0f1e 100%); }
    .card { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
  </style>
</head>
<body class="bg-app min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/static/logo.jpg" class="w-20 h-20 mx-auto rounded-2xl shadow-2xl shadow-blue-500/20 mb-4 object-cover border-2 border-gray-700/50">
      <h1 class="text-3xl font-black text-white">استعادة كلمة المرور</h1>
      <p id="stepTitle" class="text-gray-400 mt-2">أدخل اسم المستخدم</p>
    </div>

    <!-- Step 1: Username -->
    <div id="step1" class="card p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">اسم المستخدم</label>
        <input type="text" id="resetUsername" class="w-full px-4 py-3 bg-gray-800/40 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-blue-500 focus:outline-none" placeholder="اسم المستخدم">
      </div>
      <div id="fpError" class="text-red-400 text-sm hidden"></div>
      <button onclick="sendResetCode()" class="w-full py-3 bg-gradient-to-l from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold rounded-xl transition">
        إرسال كود الاستعادة
      </button>
      <a href="/login" class="block text-center text-sm text-gray-500 hover:text-gray-300 mt-4">العودة لتسجيل الدخول</a>
    </div>

    <!-- Step 2: Code + New Password -->
    <div id="step2" class="hidden card p-6 space-y-4">
      <div id="codeDisplayArea" class="bg-gray-900/60 rounded-xl p-4 text-center">
        <p class="text-sm text-gray-400 mb-2">كود إعادة التعيين (صالحة 5 دقائق):</p>
        <p id="codeDisplay" class="text-3xl font-mono tracking-widest text-blue-400 font-bold"></p>
        <p id="timerDisplay" class="text-xs text-gray-500 mt-2"></p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">كلمة المرور الجديدة</label>
        <input type="password" id="newPassword" class="w-full px-4 py-3 bg-gray-800/40 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:border-blue-500 focus:outline-none" placeholder="********">
        <p class="text-xs text-gray-500 mt-1">8 أحرف على الأقل + حرف كبير + صغير + رقم</p>
      </div>
      <div id="rpError" class="text-red-400 text-sm hidden"></div>
      <button onclick="submitReset()" class="w-full py-3 bg-gradient-to-l from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold rounded-xl transition">
        تغيير كلمة المرور
      </button>
      <p id="cooldownInfo" class="text-xs text-gray-500 text-center hidden"></p>
      <p id="refreshCodeInfo" class="text-xs text-gray-600 text-center hidden"></p>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let codeTimer = null;

    async function sendResetCode() {
      const username = document.getElementById('resetUsername').value.trim();
      const errEl = document.getElementById('fpError');
      errEl.classList.add('hidden');
      if (!username) { errEl.textContent = 'أدخل اسم المستخدم'; errEl.classList.remove('hidden'); return; }
      try {
        const res = await fetch(`${API}/api/auth/forgot-password`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('reset_username', username);
          // Now fetch the code via separate API
          await fetchResetCode(username);
        } else {
          errEl.textContent = data.detail || 'فشل الإرسال';
          errEl.classList.remove('hidden');
          if (data.detail && data.detail.includes('انتظر')) {
            const secs = parseInt(data.detail.match(/\d+/)?.[0] || '0');
            const info = document.getElementById('cooldownInfo');
            info.textContent = `انتظر ${secs} ثانية قبل إعادة المحاولة`;
            info.classList.remove('hidden');
          }
        }
      } catch (e) { errEl.textContent = 'خطأ في الاتصال'; errEl.classList.remove('hidden'); }
    }

    async function fetchResetCode(username) {
      const errEl = document.getElementById('fpError');
      try {
        const res = await fetch(`${API}/api/auth/reset-code/${encodeURIComponent(username)}`);
        const data = await res.json();
        if (res.ok) {
          document.getElementById('step1').classList.add('hidden');
          document.getElementById('step2').classList.remove('hidden');
          document.getElementById('stepTitle').textContent = 'أدخل كلمة المرور الجديدة';
          document.getElementById('codeDisplay').textContent = data.reset_code;
          // Start 5-minute countdown
          startCodeTimer(300);
        } else {
          errEl.textContent = data.detail || 'فشل الحصول على الكود';
          errEl.classList.remove('hidden');
        }
      } catch (e) { errEl.textContent = 'خطأ في الاتصال'; errEl.classList.remove('hidden'); }
    }

    function startCodeTimer(seconds) {
      if (codeTimer) clearInterval(codeTimer);
      const display = document.getElementById('timerDisplay');
      codeTimer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(codeTimer);
          display.textContent = '⏰ انتهت صلاحية الكود. ارجع واطلب واحد جديد.';
          display.classList.add('text-red-400');
          document.getElementById('codeDisplay').textContent = '—';
        } else {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          display.textContent = `⏱ ${m}:${s.toString().padStart(2, '0')} متبقي`;
        }
      }, 1000);
    }

    async function submitReset() {
      const username = localStorage.getItem('reset_username');
      const code = document.getElementById('codeDisplay').textContent.trim();
      const password = document.getElementById('newPassword').value;
      const errEl = document.getElementById('rpError');
      errEl.classList.add('hidden');
      if (!password) { errEl.textContent = 'أدخل كلمة المرور الجديدة'; errEl.classList.remove('hidden'); return; }
      try {
        const res = await fetch(`${API}/api/auth/reset-password`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, code, new_password: password }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.removeItem('reset_username');
          if (codeTimer) clearInterval(codeTimer);
          alert('تم تغيير كلمة المرور بنجاح! سجل دخول الآن.');
          window.location.href = '/login';
        } else {
          errEl.textContent = data.detail || 'فشل إعادة التعيين';
          errEl.classList.remove('hidden');
        }
      } catch (e) { errEl.textContent = 'خطأ في الاتصال'; errEl.classList.remove('hidden'); }
    }
  </script>
</body>
</html>

# ─────────────────────────────────────────────────────────────────────
# Wolf Host — Nginx Production Configuration
# ─────────────────────────────────────────────────────────────────────
#
# Architecture:
#   server_name  *.${DOMAIN}  → wildcard: captures bot slug as $subdomain
#   server_name   ${DOMAIN}  → directs to the main dashboard/API
#
# Wildcard routing (no reload required):
#   nginx uses a resolver + variable proxy_pass so DNS is resolved
#   at runtime.  Each bot container lives on `estidafa_bot_net` with
#   hostname = wh_<user_id>_<slug>, and Docker DNS resolves it
#   instantly when the container starts.
#
#   https://<bot-slug>.<domain>/  →  http://wh_<uid>_<slug>:8080/
#
# Security headers applied globally.
# ─────────────────────────────────────────────────────────────────────

# ── DNS resolver for dynamic upstream resolution ──────────────────
# Docker DNS on the estidafa_bot_net bridge network.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Global timeouts ───────────────────────────────────────────────
proxy_connect_timeout   15;
proxy_send_timeout      30;
proxy_read_timeout      86400s;  # WebSocket / long-poll keepalive

# ── Bot map file (optional; backend writes port-based overrides) ──
# include /etc/nginx/maps/*.conf;

# ──────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect + ACME challenge
# ──────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt challenge (must be accessible on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────
# HTTPS — Main dashboard & API
# ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # ── SSL (Let's Encrypt via Certbot) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ────────────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN"    always;
    add_header X-Content-Type-Options       "nosniff"       always;
    add_header X-XSS-Protection             "1; mode=block" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.telegram.org wss://${DOMAIN};" always;

    # ── Certbot webroot (for renewals over HTTPS) ───────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Dashboard & static ──────────────────────────────────────
    location /static/ {
        proxy_pass http://backend:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API + WebSocket (live logs) ─────────────────────────────
    location /api/ {
        proxy_pass http://backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket for live logs ─────────────────────────────────
    location /ws/ {
        proxy_pass http://backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Root → Dashboard ────────────────────────────────────────
    location / {
        proxy_pass http://backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ──────────────────────────────────────────────────────────────────
# HTTPS — Wildcard: each bot container gets its own subdomain
# ──────────────────────────────────────────────────────────────────
#   https://<bot-slug>.${DOMAIN}/webhook  →  container:8080/webhook
#
# The subdomain is extracted via regex and used as the container
# hostname on the estidafa_bot_net.  Docker DNS resolves it live.
# No nginx reload needed when containers start or stop.
# ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<bot_slug>[a-z0-9\-]+)\.${DOMAIN}$;

    # Wildcard SSL cert (uses the same domain cert — works for *.domain)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ────────────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN"    always;
    add_header X-Content-Type-Options       "nosniff"       always;
    add_header X-XSS-Protection             "1; mode=block" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; img-src 'self' data:;" always;

    # ── Certbot webroot ─────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Dynamic reverse proxy to bot container ──────────────────
    # Nginx resolves $bot_slug as:
    #   wh_<user_id>_<bot_slug>.estidafa_bot_net:8080
    #
    # Backend labels containers with hostname = wh_{uid}_{slug},
    # so Docker DNS resolves wh_* immediately.
    #
    # ── THE SET $backend_line BELOW IS A PLACEHOLDER ────────────
    # The actual container hostname includes the user_id prefix
    # (e.g., wh_42_my-bot).  The backend stores the exact hostname
    # in the DB.  For true zero-reload wildcard routing, the backend
    # writes nginx map entries to /etc/nginx/maps/ on container
    # start/stop.
    #
    # ── SIMPLER APPROACH (used here): ───────────────────────────
    # The backend exposes a webhook proxy endpoint at:
    #   POST /api/webhook/{bot_id}
    # Which internally forwards to the correct container.
    # This avoids needing to sync hostnames between backend & nginx.
    #
    # For direct container proxying without backend relay, enable
    # the resolver-based proxy below AFTER the backend has written
    # the map file (see /etc/nginx/maps/README).
    # ─────────────────────────────────────────────────────────────

    # ── Direct container proxy (works if the backend sets up
    #    a symlink or map for fast resolution) ────────────────────
    #   set $container_upstream "${bot_slug}:8080";
    #   proxy_pass http://$container_upstream;
    #
    # ── Default: relay through backend's webhook router ─────────
    location / {
        proxy_pass http://backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bot-Slug $bot_slug;
    }
}

# ──────────────────────────────────────────────────────────────────
# HTTP wildcard (redirect to HTTPS)
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<bot_slug>[a-z0-9\-]+)\.${DOMAIN}$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
